name: Update dictionaries

on:
  workflow_dispatch:
  schedule:
    # First Monday of each month at 06:00 UTC
    - cron: '0 6 1-7 * 1'

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build dictionaries
        run: bundle exec ruby build_dicts.rb --fresh

      - name: Check for changes
        id: diff
        run: |
          git diff --stat
          echo "changed=$(git diff --quiet && echo false || echo true)" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fr/ en/
          git commit -m "chore: update dictionaries $(date +%Y-%m-%d)"
          git push
