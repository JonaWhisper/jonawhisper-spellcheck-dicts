name: Update dictionaries

on:
  workflow_dispatch:
    inputs:
      language:
        description: "Language code (e.g. 'fr', 'pt-br'). Leave empty for all."
        required: false
        default: ""
  schedule:
    # First Monday of each month at 06:00 UTC
    - cron: '0 6 1-7 * 1'

permissions:
  contents: write

jobs:
  matrix:
    name: Build language list
    runs-on: ubuntu-latest
    outputs:
      langs: ${{ steps.list.outputs.langs }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Resolve languages
        id: list
        run: |
          if [ -n "${{ inputs.language }}" ]; then
            echo "langs=[\"${{ inputs.language }}\"]" >> "$GITHUB_OUTPUT"
          else
            echo "langs=$(bundle exec ruby build_dicts.rb --list)" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lang: ${{ fromJson(needs.matrix.outputs.langs) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: "Build ${{ matrix.lang }}"
        run: bundle exec ruby build_dicts.rb --lang "${{ matrix.lang }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dict-${{ matrix.lang }}
          path: output/
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: output/
          pattern: dict-*
          merge-multiple: true

      - name: Build manifest
        run: bundle exec ruby build_dicts.rb --manifest-only

      - name: List output
        run: ls -lh output/

      - name: Check if release needed
        id: check
        run: |
          if gh release download latest -p manifest.json -D /tmp/current 2>/dev/null; then
            old_sha=$(sha256sum /tmp/current/manifest.json | cut -d' ' -f1)
            new_sha=$(sha256sum output/manifest.json | cut -d' ' -f1)
            if [ "$old_sha" = "$new_sha" ]; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "No changes detected."
            else
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "Changes detected, will create new release."
            fi
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "No existing release found, will create initial release."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version
        if: steps.check.outputs.changed == 'true'
        id: version
        run: |
          latest=$(gh release list --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || echo "")
          if [ -z "$latest" ] || [ "$latest" = "null" ]; then
            echo "tag=v1.0.0" >> "$GITHUB_OUTPUT"
          else
            ver="${latest#v}"
            IFS='.' read -r major minor patch <<< "$ver"
            patch=$((patch + 1))
            echo "tag=v${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release
        if: steps.check.outputs.changed == 'true'
        run: |
          tag=${{ steps.version.outputs.tag }}
          gh release create "$tag" \
            --title "Dictionaries $tag" \
            --notes "Automated dictionary update — $(date +%Y-%m-%d)" \
            output/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
